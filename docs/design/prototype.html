<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duo · interaction prototype v0.1 (conversation first)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ---- Hairline tokens, copied from guangshinhaha/duo src/styles/tokens.css ---- */
:root{
  --bg:#0b0c0e; --surface:#141619; --surface-2:#1c1f24; --text:#e8eaed; --muted:#a6acb2; --faint:#5f6469;
  --accent:#7c8cff; --edge:#24282e; --escalate:#d9a441; --confident:#4b9e6a; --refused:#6b7280;
  --paper-warm:#edeae4;
  --font-ui:"Inter",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --font-reflection:"Newsreader","Iowan Old Style",Georgia,serif;
  --font-record:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --sp:4px;
  --ease-standard:cubic-bezier(0.2,0,0,1); --ease-enter:cubic-bezier(0.05,0.7,0.1,1); --ease-spring:cubic-bezier(0.34,1.32,0.64,1);
  --dur-quick:120ms; --dur-std:200ms; --dur-slow:320ms; --dur-exit:150ms; --rise:8px;
  --t:var(--dur-quick) var(--ease-standard);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:22px;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;transition:transform var(--dur-std) var(--ease-spring),background-color var(--t),border-color var(--t)}
button:not(:disabled):active{transform:scale(.98)}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-record);font-size:12px;line-height:18px;font-weight:500}
.prov{font-size:12px;line-height:18px;color:var(--muted)}
.faint{color:var(--faint)}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;font-size:16px;line-height:22px;letter-spacing:-.011em;font-weight:600}
.proto{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--edge);background:#08090a;flex-wrap:wrap}
.proto .tag{font-family:var(--font-record);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.tab{background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:2px 8px;color:var(--muted);font-size:12px;line-height:20px}
.tab:hover{border-color:var(--edge)}
.tab[aria-current="true"]{color:var(--text);border-color:var(--edge);background:var(--surface-2)}
.tab .v{font-family:var(--font-record);font-size:10px;color:var(--faint);margin-left:4px}
.sw{display:flex;gap:8px;margin-left:auto;align-items:center}
.sw label{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
.app{display:grid;grid-template-columns:268px 1fr auto;height:calc(100vh - 41px)}
body.shot .app{height:auto;min-height:calc(100vh - 41px)}
.list{border-right:1px solid var(--edge);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.list .top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.wordmark{font-weight:600;letter-spacing:-.02em;font-size:16px;display:flex;gap:8px;align-items:center}
.search{margin:0 12px 8px;background:var(--surface-2);border-radius:var(--r-sm);padding:4px 8px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between}
.filters{display:flex;gap:4px;padding:0 12px 8px}
.chip{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:0 10px;font-size:12px;line-height:24px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.chip.sig{border-color:var(--accent);color:var(--text)}
.rows{overflow:auto;padding:0 6px 12px;flex:1}
body.shot .rows{overflow:visible}
.shelf{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:12px 8px 4px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);position:relative;cursor:pointer;color:var(--muted)}
.row:hover{background:var(--surface)}
.row[aria-current="true"]{background:var(--surface-2);color:var(--text)}
.row[aria-current="true"]::after{content:"";position:absolute;left:0;top:24%;bottom:24%;width:2px;background:var(--text);border-radius:2px}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.row .ct{font-family:var(--font-record);font-size:11px;color:var(--text);background:var(--surface-2);border-radius:999px;padding:0 6px}
.row .ct.sig{background:var(--accent);color:#0b0c0e}
.row .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.av{width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--edge);font-size:9px;display:grid;place-items:center;color:var(--muted);flex:none;font-weight:600}
.av.lg{width:28px;height:28px;font-size:11px}
.duo-mark{display:inline-flex;gap:2px;height:12px;align-items:stretch;flex:none}
.duo-mark i{display:block;border-radius:1px}
.duo-mark i:first-child{width:3px;background:var(--text)}
.duo-mark i:last-child{width:1px;background:var(--accent);transform-origin:top}
.duo-mark.lg{height:18px}.duo-mark.lg i:first-child{width:4px}.duo-mark.lg i:last-child{width:1.5px}
.duo-mark.desk i:first-child{background:var(--muted)}
.duo-mark[data-working] i:last-child{animation:work 800ms var(--ease-standard) infinite}
@keyframes work{0%{opacity:1;transform:scaleY(0)}50%{opacity:1;transform:scaleY(1)}75%{opacity:0;transform:scaleY(1)}100%{opacity:0;transform:scaleY(0)}}
.avt{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--surface-2);color:var(--muted);font-size:13px;display:inline-grid;place-items:center;padding:0}
.avt.sel{border-color:var(--text);color:var(--text)}
.deskTag{font-family:var(--font-record);font-size:9px;color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:0 3px;line-height:14px;font-weight:500}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--edge);min-height:56px}
.hdr .who{flex:1;min-width:0}
.hdr .who .t{font-weight:600;display:flex;gap:8px;align-items:center}
.hdr .who .s{font-size:12px;color:var(--muted);line-height:16px}
.banner{margin:0;padding:6px 20px;border-bottom:1px solid var(--edge);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;background:var(--surface)}
.banner.ver{background:transparent;color:var(--faint)}
.offline{display:none;padding:6px 20px;background:var(--surface-2);border-bottom:1px solid var(--edge);font-size:12px;color:var(--text)}
body.is-offline .offline{display:block}
.label-bar{padding:6px 20px;border-bottom:1px solid var(--edge);font-size:12px;color:var(--text);background:var(--surface-2);display:flex;gap:8px;align-items:center}
.stream{flex:1;overflow:auto;padding:20px 20px 12px;display:flex;flex-direction:column;gap:18px}
body.shot .stream{overflow:visible}
.stream > *{max-width:720px;width:100%}
.day{align-self:center;max-width:none;width:auto!important;font-size:11px;color:var(--faint);font-family:var(--font-record)}
.msg{display:flex;gap:10px;animation:rise var(--dur-std) var(--ease-enter) backwards}
@keyframes rise{from{opacity:0;transform:translateY(var(--rise))}}
.msg .body{flex:1;min-width:0}
.msg .meta{font-size:12px;line-height:18px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .meta b{color:var(--text);font-weight:600}
.msg .txt{margin-top:2px}
.msg.me .txt{background:var(--surface-2);border-radius:var(--r-md);padding:8px 12px;display:inline-block}
.foot{font-size:11px;color:var(--faint);margin-top:2px}
.pill{background:color-mix(in srgb,var(--text) 10%,transparent);border-radius:4px;padding:0 4px;font-weight:500}
.pill.duo{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.duo{animation:rise var(--dur-std) var(--ease-enter) backwards;position:relative}
.attr{display:flex;gap:6px;align-items:center;font-size:12px;line-height:18px;color:var(--muted);margin-bottom:4px}
.attr b{color:var(--text);font-weight:600}
.attr .vis{margin-left:auto;font-family:var(--font-record);font-size:11px;color:var(--faint)}
.line{position:relative;border:1px solid var(--edge);border-left:0;border-radius:0 var(--r-md) var(--r-md) 0;background:var(--surface);padding:10px 14px}
.line::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:var(--ln,var(--faint));transform-origin:top;animation:draw var(--dur-slow) var(--ease-enter) 60ms backwards}
@keyframes draw{from{transform:scaleY(0)}}
.ln-moss{--ln:var(--confident)}.ln-amber{--ln:var(--escalate)}.ln-ash{--ln:var(--refused)}.ln-faint{--ln:var(--faint)}
.line.quiet{background:var(--surface-2);border-color:transparent}
.line.draft{border-style:dashed;border-color:var(--faint);border-left:0;background:transparent}
.draftnote{font-family:var(--font-record);font-size:11px;color:var(--faint);margin-top:6px}
.card-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.card-h .k{font-family:var(--font-record);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card-h .st{margin-left:auto;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{white-space:nowrap;border:1px solid var(--edge);background:transparent;border-radius:var(--r-sm);padding:0 12px;line-height:30px;font-size:13px;min-height:32px}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0b0c0e;font-weight:600}
.btn.sm{line-height:24px;min-height:26px;padding:0 10px;font-size:12px}
.btn.link{border:0;padding:0 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:0;line-height:20px}
.kbd{font-family:var(--font-record);font-size:10px;opacity:.7;margin-left:6px}
.reason{font-size:12px;color:var(--muted);width:100%}
.decided{opacity:.55}
.ms{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.ms li{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.ms li .dot{width:14px;flex:none;color:var(--faint);font-family:var(--font-record);font-size:11px}
.ms li.now{color:var(--text)}
.ms li.done .dot{color:var(--confident)}
.res{margin-top:10px;border-top:1px solid var(--edge);padding-top:10px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--edge);border-radius:var(--r-sm);padding:6px 10px;margin-top:6px;background:var(--bg)}
.fi{font-family:var(--font-record);font-size:10px;color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:0 4px}
.file .fn{flex:1;font-size:13px;display:flex;gap:6px;align-items:center}
a{color:var(--text);text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--edge);background:var(--bg);border-radius:var(--r-sm);padding:8px 12px;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{font-family:var(--font-record);font-size:11px;color:var(--faint)}
.opt .d{display:block;font-size:12px;color:var(--muted)}
.opt.chosen{border-color:var(--text);opacity:1}
.reacts{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.rx{border:1px solid var(--edge);background:transparent;border-radius:999px;font-size:12px;line-height:20px;padding:0 8px}
.rx.mine{border-color:var(--muted);background:var(--surface-2)}
.rx.add{color:var(--faint)}
.notice{font-size:12px;color:var(--muted);margin-top:6px}
.trust{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.trust .bar{display:inline-block;width:2px;height:10px;background:var(--ln,var(--faint))}
.outcome{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:-8px}
.outcome .o{font-family:var(--font-record);font-size:11px;border:1px solid var(--edge);border-radius:4px;padding:0 6px;color:var(--text)}
.ph{font-family:var(--font-record);font-size:12px;color:var(--muted);background:var(--bg);border:1px dashed var(--edge);border-radius:4px;padding:1px 6px}
.form{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center;margin-top:8px}
.form > label{font-size:12px;color:var(--muted)}
.form input,.form textarea{background:var(--bg);border:1px solid var(--edge);border-radius:var(--r-sm);padding:4px 8px;width:calc(100% - 60px)}
.form input:disabled,.form textarea:disabled{color:var(--muted)}
.form textarea{resize:vertical;min-height:52px;vertical-align:middle}
.guess{font-family:var(--font-record);font-size:10px;color:var(--faint);margin-left:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle .tr{width:28px;height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--edge);position:relative;flex:none;transition:background-color var(--t)}
.toggle .tr::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform var(--dur-std) var(--ease-spring)}
.toggle.on .tr{background:var(--text)}.toggle.on .tr::after{transform:translateX(12px);background:var(--bg)}
.toggle.locked{cursor:default;opacity:.7}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:999px;padding:0 4px 0 6px;font-size:12px;line-height:22px;background:var(--bg)}
.mchip button{border:0;background:transparent;color:var(--faint);padding:0 4px}
.warn{border:1px solid var(--edge);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;color:var(--text);background:var(--surface-2);margin-top:10px}
.hatch{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--text) 6%,transparent) 6px 7px);border:1px dashed var(--edge);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--text)}
.diff del{color:var(--faint)}.diff ins{text-decoration:none;background:color-mix(in srgb,var(--text) 14%,transparent);border-radius:3px;padding:0 2px}
.pcols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pcol{background:var(--bg);border:1px solid var(--edge);border-radius:var(--r-sm);padding:8px}
.pcol h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--text)}
.pitem{display:flex;gap:6px;align-items:center;font-size:12px;line-height:18px;padding:4px 6px;border-radius:4px;border:1px solid transparent;width:100%;background:transparent;text-align:left;color:var(--text)}
.pitem:hover:not(:disabled){border-color:var(--edge)}
.pitem:disabled{opacity:1;cursor:default}
.pitem.sel{border-color:var(--accent)}
.pitem .tier{font-family:var(--font-record);font-size:10px;color:var(--faint);margin-left:auto}
.pitem.new{background:color-mix(in srgb,var(--text) 8%,transparent)}
.mover{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.reach{margin:6px 0 0;display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12px}
.reach dt{color:var(--muted)}.reach dd{margin:0}
.composer{border-top:1px solid var(--edge);padding:10px 20px 14px}
.sugg{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.cbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:var(--r-md);padding:6px 6px 6px 12px}
.cbox input{flex:1;background:transparent;border:0;outline:0;font-size:14px;min-width:0}
.cnote{font-size:11px;color:var(--faint);margin-top:6px}
.insp{width:0;overflow:hidden;border-left:1px solid var(--edge);transition:width var(--dur-std) var(--ease-standard)}
.insp.on{width:288px}
.insp .in{width:288px;padding:16px;display:flex;flex-direction:column;gap:18px}
.insp h5{margin:0 0 6px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.insp .blk{font-size:13px;color:var(--muted)}
.insp .blk p{margin:0 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.portrait{font-family:var(--font-reflection);font-size:20px;line-height:28px;color:var(--paper-warm);text-wrap:balance}
.mem{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;color:var(--text)}
.mem .r{margin-left:auto;font-size:11px;color:var(--faint)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--edge)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--edge);vertical-align:middle;color:var(--muted)}
.tbl td:first-child{color:var(--text)}
.state{font-family:var(--font-record);font-size:11px;padding:0 6px 0 10px;border-radius:4px;border:1px solid var(--edge);color:var(--text);white-space:nowrap;position:relative}
.state::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:2px;background:var(--ln,var(--faint))}
.empty{color:var(--muted);font-size:13px;padding:24px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;animation:fade var(--dur-std) var(--ease-standard)}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-lg);padding:20px;width:440px;box-shadow:0 24px 64px rgba(0,0,0,.55);animation:pop var(--dur-slow) var(--ease-spring)}
@keyframes pop{from{opacity:0;filter:blur(5px);transform:translateY(12px) scale(.96)}}
.dialog p{color:var(--muted);margin:8px 0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--surface-2);border:1px solid var(--edge);border-radius:var(--r-md);padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:30;animation:toast var(--dur-slow) var(--ease-spring);max-width:520px}
@keyframes toast{from{opacity:0;transform:translateX(16px)}}
.popover{position:absolute;z-index:10;right:0;top:100%;width:320px;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-md);padding:12px;margin-top:6px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.popover h5{margin:8px 0 2px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.popover h5:first-child{margin-top:0}
.popover div{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body.shot *{animation:none!important}
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<div class="app">
  <aside class="list" id="list"></aside>
  <main class="conv" id="conv"></main>
  <aside class="insp on" id="insp"></aside>
</div>
<div id="overlay"></div>
<script>
/* ============ data & state ============ */
const OWNER = 'Rachel', OWNER_FULL = 'Rachel Lim';
const SCREENS = [
  ['duo','1:1 · task','v1'],
  ['cards','Draft · confirm · reactions','v1'],
  ['visitor','Visitor view','v1'],
  ['owner','Owner view','v1'],
  ['perms','Permissions in chat','v1'],
  ['mkgroup','Create group in chat','v1'],
  ['group','Group room · @mention','v1'],
  ['tasks','Task list','v1'],
  ['mkdesk','Create desk duo in chat','v2'],
  ['orch','Orchestrator room','v2'],
];
const init = () => ({
  screen:'duo', offline:false, error:false, empty:false, insp:true,
  rx:{a1:{'👍':1}}, rxPick:null, wrongFor:null, wrongSent:false,
  task:0, taskChoice:null,
  draft:'open', draftText:"Hi Priya, yes. The vendor shortlist for the records-digitisation pilot is in the Q4 folder. Two of the three vendors have cleared security review; the third is due on 28 Oct.", why:false,
  t4:'card', dlg:null,

    <div class="form">
      <label>Name</label><div><input value="${esc(S.deskName)}" ${locked?'disabled':''} oninput="S.deskName=this.value"><span class="guess">guessed</span></div>
      <label>Role</label><div><input value="${esc(S.deskRole)}" ${locked?'disabled':''}><span class="guess">guessed</span></div>
      <label>One-line brief</label><div><input value="${esc(S.deskBrief)}" ${locked?'disabled':''}><span class="guess">guessed</span></div>
      <label>Instructions</label><div><textarea ${locked?'disabled':''}>${esc(S.deskInstr)}</textarea></div>
      <label>Avatar</label><div style="display:flex;gap:6px;align-items:center">${AV.map((g,i)=>`<button class="avt ${S.deskAv===i?'sel':''}" ${locked?'disabled':''} onclick="set('deskAv',${i})" aria-label="Avatar ${i+1}">${g}</button>`).join('')}<button class="chip" ${locked?'disabled':''}>Upload image</button><span class="prov">Never a person's photo.</span></div>
      <label>Tag</label><div style="display:flex;gap:8px;align-items:center"><input style="width:56px" class="mono" value="${S.deskTag}" maxlength="2" ${locked?'disabled':''}><span class="prov">Shown beside the name everywhere, with the duo mark.</span></div>

      <label>Knows</label><div class="mchips">${S.deskSources.map(s=>`<span class="mchip"><span class="fi">DIR</span>${s}${locked?'':'<button aria-label="Remove">×</button>'}</span>`).join('')}${locked?'':'<button class="chip">+ Add source</button>'}</div>
      <label>May do</label><div><label class="toggle on locked"><span class="tr"></span>Drafts everything for you</label><span class="guess">default; it earns more</span></div>
      <label>Who can use it</label><div class="prov">Only you. Visitors can't reach desk duos.</div>
    </div>
    <div class="warn">Not cleared for classified or sensitive government data. Only add sources cleared for this pilot.</div>`;
  if (S.desk<2) it.push(duo({state:'form', time:'16:00', ln:'faint', html: form(false) + `<div class="acts"><button class="btn pri" ${off()?'disabled':''} onclick="S.desk=2;render();setTimeout(()=>{S.desk=3;S.deskCount++;render()},1100)">Create desk duo</button><button class="btn" onclick="toast('Cancelled. Nothing was created.')">Cancel</button>${offReason('Create')}</div>`}));
  else it.push(duo({state:'form · submitted', time:'16:01', ln:'faint', cls:'decided', html: form(true)}));
  if (S.desk===2) it.push(duo({state:'task · working', time:'16:01', ln:'faint', working:true, html:`<ul class="ms" style="margin:0"><li class="done"><span class="dot">✓</span>Created Policy research</li><li class="now"><span class="dot">·</span>Reading 2 folders (142 documents)</li></ul>`}));
  if (S.desk>=3) {
    if (S.error) it.push(duo({state:'result', time:'16:01', ln:'faint', html:`Couldn't create it: <span class="ph">daemon error, verbatim</span>. Nothing was created.<div class="acts"><button class="btn sm" onclick="S.error=false;render()">Try again</button></div>`}));
    else {
      it.push(duo({state:'result', time:'16:01', ln:'moss', html:`<div class="card-h"><span class="k">Desk duo created</span><span class="st mono">52 s</span></div>
        <div style="display:flex;gap:12px;align-items:center"><span class="avt sel" style="cursor:default">${AV[S.deskAv]}</span><div><div>${mark({desk:true})} <b>${esc(S.deskName)}</b> <span class="deskTag">${S.deskTag}</span> <span class="prov">· Rachel's desk duo</span></div><div class="prov">${esc(S.deskBrief)}</div></div></div>
        <div class="prov" style="margin-top:6px">Read 142 documents. Drafts everything for you until it earns more. Only you can use it.</div>
        <div class="acts"><button class="btn pri">Open its chat</button><button class="btn">Edit</button><button class="btn" onclick="S.desk=0;S.deskCount--;S.routine=0;toast('Policy research desk duo ended.',()=>{S.desk=3;S.deskCount++})">End it</button></div>`}));
      it.push(person({name:'You', ini:'RL', time:'16:03', html:'Every Monday 9am, have it draft the weekly policy digest from new circulars.', me:true}));
      const rb = `<div class="card-h"><span class="k">New routine</span></div>
        <div class="form"><label>When</label><div><input value="Every Monday, 09:00" ${S.routine?'disabled':''}></div><label>Desk duo</label><div style="display:flex;gap:6px;align-items:center">${mark({desk:true})} Policy research</div><label>Does</label><div><input value="Drafts the weekly policy digest from new circulars" ${S.routine?'disabled':''}></div><label>Delivers to</label><div class="prov">This chat, as a task with links. Nothing goes to anyone else.</div></div>`;
      if (!S.routine) it.push(duo({state:'confirm', time:'16:03', ln:'amber', html: rb + `<div class="acts"><button class="btn pri" ${off()?'disabled':''} onclick="set('routine',1)">Set routine</button><button class="btn" onclick="toast('Cancelled. No routine was set.')">Cancel</button>${offReason('Confirm')}</div>`}));
      else {
        it.push(duo({state:'confirm · done', time:'16:03', ln:'amber', cls:'decided', html: rb}));
        it.push(duo({state:'result', time:'16:03', ln:'moss', html:`<div class="card-h"><span class="k">Your routines</span><span class="st">3</span></div>
          <table class="tbl"><tr><th>When</th><th>Desk duo</th><th>Does</th><th>Last run</th><th>On</th></tr>
          <tr><td>Mon 09:00</td><td>Policy research</td><td>Weekly policy digest</td><td class="mono">first run 26 Oct</td><td><label class="toggle on" onclick="this.classList.toggle('on')"><span class="tr"></span></label></td></tr>
          <tr><td>Mon 09:00</td><td>Weekly reports</td><td>Weekly status</td><td><span class="state">failed</span></td><td><label class="toggle on" onclick="this.classList.toggle('on')"><span class="tr"></span></label></td></tr>
          <tr><td>New file in Circulars/</td><td>Procurement</td><td>Summarise it</td><td><span class="state" style="--ln:var(--confident)">done</span></td><td><label class="toggle" onclick="this.classList.toggle('on')"><span class="tr"></span></label></td></tr></table>
          <div class="prov" style="margin-top:6px">The switch pauses a routine. Say "delete the weekly status routine" to remove one.</div>`}));
      }
    }
  }
  return { hdr: hdrDuo(), body: it.join(''), composer: composer('Ask your duo…'), banner: deskBanner() };
};
function deskBanner(){ return `<div class="banner ver"><span class="mono">v2</span> One personal duo plus up to 5 desk duos, owner-only (D1, decided 20 Oct 2026). <button class="btn link" onclick="S.desk=0;S.routine=0;S.deskCount=S.deskCount>=5?3:5;render()">${S.deskCount>=5?'Show the normal case':'Show the at-5 case'}</button></div>`; }

/* 10. orchestrator room (v2) */
scr.orch = () => {
  const st = S.orch;
  const it = [];
  it.push(person({name:'You', ini:'RL', time:'09:30', html:`<span class="pill duo">${mark()} Your duo</span> I need a one-page briefing on vendor consolidation for Thursday's EXCO, with the spend numbers.`, me:true}));
  it.push(duo({name:'Your duo', tag:'LEAD', state:'ack', time:'09:30', ln:'faint', html:"On it. The spend analysis goes to Data and the summary to Comms. I'll post the finished briefing here."}));
  it.push(duo({name:'Your duo', tag:'LEAD', state:'handoffs', time:'09:30', ln:'faint', quiet:true, html:`
    <div class="file" style="margin-top:0"><span class="fi">HANDOFF</span><span class="fn">${mark({desk:true})} Data · vendor spend FY25–26</span><span class="mono faint">hop 1/1 · 20 min</span><span class="mono">${st>=1?'done':'working'}</span></div>
    <div class="file"><span class="fi">HANDOFF</span><span class="fn">${mark({desk:true})} Comms · EXCO summary</span><span class="mono faint">hop 1/1 · 15 min</span><span class="mono">${S.error&&st>=1?'failed':st>=4?'done':st>=2?'needs decision':'waiting on Data'}</span></div>
    <div class="prov" style="margin-top:6px">Only your duo hands off. Desk duos can't hand off again.</div>`}));
  if (st>=1) it.push(duo({name:'Data', desk:true, tag:'DA', state:'finished', time:'09:41', ln:'moss', html:`Spend with 14 vendors totalled $3.2M in FY25–26. The top 3 vendors hold most of it (bar below).<div style="margin-top:6px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="width:71%;height:100%;background:var(--muted)"></div></div><div class="file"><span class="fi">XLSX</span><span class="fn">vendor-spend-FY25-26.xlsx</span><button class="btn sm">Open</button></div>`}));
  if (S.error && st>=1) it.push(duo({name:'Comms', desk:true, tag:'CO', state:'failed', time:'09:50', ln:'faint', html:'Over budget: stopped at 15 min and returned to your duo.'}), duo({name:'Your duo', tag:'LEAD', state:'needs a choice', time:'09:50', ln:'amber', html:`Comms ran out of time on the summary. What now?<div class="opts"><button class="opt"><span class="n">1</span><span>Give it 15 more minutes</span></button><button class="opt"><span class="n">2</span><span>Send me the spend table only</span></button></div>`}));
  else {
    if (st>=2) it.push(duo({name:'Comms', desk:true, tag:'CO', state:st>=3?'decided':'needs a choice', time:'09:47', ln:'amber', html:`Which framing should the briefing lead with?<div class="opts">${['Savings first','Risk first (single-vendor dependency)','Neutral options paper'].map((o,i)=>`<button class="opt ${S.tone===o?'chosen':''}" ${st>=3?'disabled':''} onclick="S.tone='${o}';S.orch=3;render()"><span class="n">${i+1}</span><span>${o}</span></button>`).join('')}</div>`}));
    if (st>=4) it.push(duo({name:'Your duo', tag:'LEAD', state:'result', time:'09:55', ln:'moss', html:`Briefing ready, leading with ${(S.tone||'Savings first').toLowerCase()}.<div class="file"><span class="fi">DOCX</span><span class="fn">EXCO-briefing-vendor-consolidation.docx</span><span class="prov">1 page</span><button class="btn sm">Open</button></div><div class="prov" style="margin-top:6px">From Data (spend table) and Comms (summary). 2 handoffs, 25 min.</div>` + reacts('o1')}));
  }
  const next = (st===0||st===1||st===3) && !(S.error&&st>=1) ? `<div><button class="btn sm" onclick="S.orch=${st===3?4:st+1};render()">Simulate next</button></div>` : '';
  return {
    hdr: `${mark({lg:true})}<div class="who"><div class="t">Q4 briefing room</div><div class="s">You · your duo (lead) · 3 desk duos</div></div><button class="btn sm" onclick="set('insp',!S.insp)">Members<span class="kbd">⌘I</span></button>`,
    banner: `<div class="banner ver"><span class="mono">v2</span> You talk to your duo. Desk duos post only finished work or a choice. Made in chat: "make a room with my Data, Comms and Procurement desk duos".</div>`,
    body: it.join('') + next,
    composer: composer('Message your duo (lead)…'),
    insp: `<div><h5>People</h5><div class="mem">${av('RL')} Rachel Lim (you)</div></div>
      <div><h5>Lead</h5><div class="mem">${mark()} Your duo<span class="r">hands off work</span></div></div>
      <div><h5>Desk duos</h5>${[['Data','DA'],['Comms','CO'],['Procurement','PC']].map(([n,t])=>`<div class="mem">${mark({desk:true})} ${n} <span class="deskTag">${t}</span><span class="r">finished work only</span></div>`).join('')}</div>
      <div><h5>Budget</h5><div class="blk"><p>Each handoff carries a time budget. Over budget ends it as failed, with a reason, back to the lead.</p></div></div>`
  };
};

function inspDefault(){
  if (S.screen==='cards') return `<div><h5>Why it drafted</h5><div class="blk"><p>Trust reading: confident.</p><p>Standing order: "Vendor status: answer from the Q4 folder".</p><p>Drew on 3 sources.</p></div></div><div><h5>Who's asking</h5><div class="blk"><p>${av('PN')} Priya Nair · Records Division</p></div></div><div><h5>Waiting on you here</h5><div class="blk"><p>${(S.draft==='open'||S.draft==='editing'?1:0)+(S.t4==='card'?1:0)}</p></div></div>`;
  if (S.screen==='tasks') return `<div><h5>About this list</h5><div class="blk"><p>A read-only mirror. Every row opens the chat where you act on it.</p></div></div><div><h5>States</h5><div class="blk"><p>acknowledged → working → needs decision → done or failed</p></div></div>`;
  return `<div><h5>Portrait</h5><div class="portrait">You were asked about procurement limits 23 times in six months.</div></div>
  <div><h5>Knows</h5><div class="blk"><p>Q4 folder · Policy circulars · 3 bridged chats</p></div></div>
  <div><h5>Desk duos</h5><div class="blk"><p>${S.deskCount} of 5</p></div></div>
  <div><h5>Ask it</h5><div class="blk"><p>"What can you do?" · "What's open?" · "Make a group with…" · "Create a desk duo for…"</p></div></div>`;
}

/* ============ render ============ */
function render(){
  document.body.classList.toggle('is-offline', S.offline);
  const s = scr[S.screen]();
  document.getElementById('proto').innerHTML = `<span class="tag">duo prototype v0.1</span>${SCREENS.map(([id,l,v])=>`<button class="tab" aria-current="${S.screen===id}" onclick="go('${id}')">${l}<span class="v">${v}</span></button>`).join('')}
    <span class="sw"><label><input type="checkbox" ${S.offline?'checked':''} onchange="set('offline',this.checked)">Offline</label><label><input type="checkbox" ${S.error?'checked':''} onchange="set('error',this.checked)">Error</label><label><input type="checkbox" ${S.empty?'checked':''} onchange="set('empty',this.checked)">Empty</label><button class="tab" onclick="const sc=S.screen;S=init();S.screen=sc;render()">Reset</button></span>`;
  document.getElementById('list').innerHTML = s.list || ownerList(S.screen);
  document.getElementById('conv').innerHTML = `<div class="offline">You're offline. Messages you write send when you reconnect. Send, Confirm and Create are off until then.</div>
    <div class="hdr">${s.hdr}</div>${s.banner||''}<div class="stream" id="stream">${s.body}</div>${s.composer||''}`;
  const insp = document.getElementById('insp'); insp.classList.toggle('on', S.insp);
  insp.innerHTML = `<div class="in">${s.insp || inspDefault()}</div>`;
  let ov = '';
  if (S.dlg==='t4') ov = `<div class="scrim"><div class="dialog" role="alertdialog" aria-labelledby="dt"><h3 id="dt">Withdraw tender TND-2026-0412?</h3><p class="mono faint">Sample, nothing runs</p><p>This withdraws the records-digitisation pilot tender from the procurement portal. The portal notifies all 3 vendors. <b style="color:var(--text)">It can't be undone.</b></p><p class="prov">Confirm has no keyboard shortcut. Cancel is focused.</p><div class="acts" style="justify-content:flex-end"><button class="btn" id="dcancel" onclick="S.dlg=null;render()">Cancel</button><button class="btn pri" ${off()?'disabled':''} onclick="S.dlg=null;S.t4='done';render()">Confirm</button></div></div></div>`;
  if (S.toast) ov += `<div class="toast">${esc(S.toast.msg)}${S.toast.undo?`<button class="btn sm" onclick="undo()">Undo<span class="kbd">⌘Z</span></button>`:''}</div>`;
  document.getElementById('overlay').innerHTML = ov;
  if (S.dlg) setTimeout(()=>{ const c=document.getElementById('dcancel'); c && c.focus(); }, 0);
}
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key==='i') { e.preventDefault(); set('insp',!S.insp); }
  if ((e.metaKey||e.ctrlKey) && e.key==='z' && S.toast && S.toast.undo) { e.preventDefault(); undo(); }
  if (e.key==='Escape' && S.dlg) { S.dlg=null; render(); }
});
const q = new URLSearchParams(location.search);
if (q.get('screen')) S.screen = q.get('screen');
if (q.get('shot')) document.body.classList.add('shot');
window.__S = () => S; window.__set = o => { Object.assign(S, o); render(); };
render();
</script>
</body>
</html>
